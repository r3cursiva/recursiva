name: CI

# The checks on Linux, on GitHub's machines, for pull requests from forks — outside contributors, who have no pre-push
# hook — and by hand (gh workflow run CI --ref <branch>). The owner's own branches are checked on the Mac: the pre-push
# hook runs pnpm check and pnpm release runs it on the commit it ships (ADR 0035). A fork's pull request gets a
# read-only token and no secrets (the pull_request event, never pull_request_target).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # In a container: the browsers come with the image, and 127.0.0.1 is the container's own. The tag follows `playwright`
    # in tools/perf/package.json.
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    services:
      # The build prod runs (deploy/stand/compose.yaml; compose.yaml locally), from the mirror: Docker Hub limits a machine's IP. Server tests recreate rsva_test; sync:browser makes a database of its own.
      db:
        image: mirror.gcr.io/library/postgres:18.6@sha256:bc8d7bdd54dc38115ef954fef07f30a96bb2b5b080effa692e0093f03eabac8f
        env:
          POSTGRES_USER: rsva
          POSTGRES_PASSWORD: rsva
          POSTGRES_DB: rsva
        options: >-
          --health-cmd "pg_isready -U rsva"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rsva:rsva@db:5432/rsva_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container's user does not own the mounted workspace; git refuses it without this.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
      # The same list as the pre-push hook: types, clones, dead code, tests, build, startup size.
      - run: pnpm check
      # Nothing to do while the image's tag matches; a newer Playwright downloads its browser here.
      - run: pnpm --filter @rsva/perf exec playwright install chromium-headless-shell
      # What a person sees when changes do not reach the server: the real app in Chromium (tools/sync-lab). The engine-level
      # scenarios run in `pnpm test`.
      - run: pnpm sync:browser
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync
          path: perf/out/

name: CLA

# Asks every outside pull request author to sign CLA.md and records the signature (ADR 0055, RSVA-562).
# Runs from the default branch (pull_request_target, issue_comment) and never checks out or runs PR code.
# Signatures live in this repository, on the unprotected branch `cla-signatures`; GITHUB_TOKEN is enough, no PAT.
# Exempt logins (the owner, bots) come from the repository variable CLA_ALLOWLIST, comma-separated, e.g. "dependabot[bot],github-actions[bot]".
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action reads PR commits, comments, writes statuses and commits signatures.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only in a public repository: a private one has no outside authors, and the check would fail there for want of the
    # signatures branch and the allowlist. Comments other than the two phrases below never start a run.
    if: >-
      !github.event.repository.private && (
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    steps:
      # contributor-assistant/github-action v2.6.1 (2024-09-26)
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ${{ vars.CLA_ALLOWLIST }}

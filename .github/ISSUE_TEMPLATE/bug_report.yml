name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Questions and ideas go to [Discussions](https://github.com/r3cursiva/recursiva/discussions).
        A security problem does not go here: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or release you run.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, or how you self-host (docker compose, a Node version).

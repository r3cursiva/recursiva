# recursiva on one machine (SELF_HOSTING.md): the app and its Postgres.
#   cp .env.example .env && docker compose up -d --build     # builds the image from this checkout
#   docker compose pull && docker compose up -d              # or fetches the published one (.github/workflows/images.yml)
# Data lives in two named volumes, db and files; `./backup.sh` copies both and the version into one archive.
name: recursiva
x-logs: &logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18.6@sha256:bc8d7bdd54dc38115ef954fef07f30a96bb2b5b080effa692e0093f03eabac8f
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: rsva
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: rsva
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rsva"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: ${RSVA_IMAGE:-ghcr.io/r3cursiva/recursiva}:${RSVA_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    logging: *logs
    environment:
      DATABASE_URL: postgres://rsva:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/rsva
      RSVA_MAIL: ${RSVA_MAIL:-log}
      # The server inside the container listens on 0.0.0.0 (HOST), so it would refuse to write codes to the log; the port
      # is published on RSVA_BIND, loopback by default, and the logs are the owner's.
      RSVA_ALLOW_LOG_MAIL: "1"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RSVA_MAIL_FROM: ${RSVA_MAIL_FROM:-}
      RSVA_ALLOWED_HOSTS: ${RSVA_ALLOWED_HOSTS:-}
      RSVA_ALLOWED_ORIGINS: ${RSVA_ALLOWED_ORIGINS:-}
      RSVA_TRUST_PROXY: ${RSVA_TRUST_PROXY:-}
      RSVA_WORKSPACE_CREATORS: ${RSVA_WORKSPACE_CREATORS:-}
      RSVA_NOTIFY: ${RSVA_NOTIFY:-off}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - files:/data/files
    ports:
      - "${RSVA_BIND:-127.0.0.1}:${RSVA_PORT:-3800}:3800"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3800/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  db:
  files:
